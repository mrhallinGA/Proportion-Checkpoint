g:14px}.math-table{border-collapse:collapse;width:100%;max-width:430px;margin:auto;text-align:center;font-variant-numeric:tabular-nums}.math-table th,.math-table td{border:1px solid #9dbab7;padding:8px 9px}.math-table th{background:#eaf4f0;font-size:.86rem}.math-table td{font-weight:600}.equation{font-size:clamp(1.65rem,5vw,2.7rem);font-weight:800;text-align:center;margin:11px 0;color:#10586a;letter-spacing:.015em}.scenario{font-size:1.11rem;line-height:1.65;margin:7px 0 8px}.scenario strong{color:var(--coral-dark)}.graphsvg{width:100%;max-width:350px;display:block;margin:auto;aspect-ratio:360/340}.graphlabel{font-size:.83rem;text-align:center;color:var(--muted);margin-top:3px}.labeltop{font-size:.83rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 10px}.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{border:2px solid #c6d9d5;border-radius:12px;padding:12px;display:flex;gap:9px;align-items:center;cursor:pointer;background:white;font-weight:800;min-height:54px}.choice:hover{background:#f3faf8}.choice.selected{border-color:var(--teal);background:#ebf8f4}.choice input{accent-color:var(--teal);width:18px;height:18px;margin:0;flex-shrink:0}.evidence{background:#f6faf8;border:1px solid #d9e6e1;border-radius:13px;padding:14px 15px;margin-top:14px}.evidence .whytitle{font-size:.92rem;font-weight:850;margin-bottom:9px}.evidence .micro{font-size:.85rem;color:var(--muted);margin:8px 0 0}.evidence .radios{display:grid;gap:8px}.answerline{padding:9px 10px;border:1px solid #d6e3df;border-radius:9px;background:white;display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:.9rem}.answerline:has(input:checked){border-color:var(--teal);background:#e6f8f2}.answerline input{margin-top:3px;accent-color:var(--teal)}.krow{display:flex;align-items:center;gap:11px;max-width:330px}.krow label{font-weight:900;font-size:1.18rem;white-space:nowrap}.kinput{max-width:220px;font-weight:750;font-variant-n <body>
  <header class="sitehead"><div class="headinner"><div><div class="brandline">◉ PROPORTION CHECKPOINT</div><div class="branddesc">A focused introduction to the constant of proportionality</div></div><div class="headtag">INTRO ACTIVITY · NOT PROPORTION QUEST</div></div></header>
  <div class="subhead"><small id="whoLine">BEFORE YOU START PROPORTION QUEST</small><small id="progressLabel">0 of 16 examples verified</small></div>
  <div class="progresswrap"><div class="progressrail" role="progressbar" aria-label="Question progress" aria-valuemin="0" aria-valuemax="16" aria-valuenow="0" id="progressOuter"><div class="progressfill" id="progressFill"></div></div></div>
  <main id="app" class="page"></main>
  <noscript><div class="noscript">This activity needs JavaScript enabled to check answers and save progress.</div></noscript>
<script>
'use strict';
// All content and logic are self-contained. No account, server, or outside library is needed.
const KEY='hall-proportion-checkpoint-v1';
const STAGES=[
  {title:'Table Lab',sub:'Compare y ÷ x for more than one row. Check what happens at x = 0.',icon:'▦',start:0,end:4},
  {title:'Graph Gallery',sub:'A proportional graph MUST be a straight line that goes through (0, 0).',icon:'⌁',start:4,end:8},
  {title:'Equation + Story Studio',sub:'Find the same multiplier k, with no extra starting amount.',icon:'≋',start:8,end:16}
];
// correct and k are internal checking values: nothing is revealed to students until verified.
const ITEMS=[
  {id:'T-A',stage:0,letter:'A',prompt:'Is this time-and-cost table proportional?',kind:'table',headers:['Time (hours)','Cost (dollars)'],rows:[[0,'$5'],[1,'$10'],[2,'$15'],[3,'$20']],correct:false,why:['The cost increases by $5 each hour.','At 0 hours, the cost is already $5.','The time is measured in hours.'],proofIndex:1,hint:'Check the cost at zero hours. A y = kx relationship always includes (0, 0).',explanation:'Even at 0 hours, the cost is $5. The relationship is y = 5x + 5, not y = kx. A steady increase alone is not enough.'},
  {id:'T-B',stage:0,letter:'B',prompt:'Is this x–y table proportional?',kind:'table',headers:['x','y'],rows:[[0,0],[3,12],[4,16],[10,40]],correct:true,k:4,kUnit:'units of y per 1 x',hint:'Compare y ÷ x for two nonzero rows, then check (0, 0).',explanation:'12 ÷ 3 = 4, 16 ÷ 4 = 4, and 40 ÷ 10 = 4. The origin is included, so k = 4 and y = 4x.'},
  {id:'T-C',stage:0,letter:'C',prompt:'Is this x–y table proportional?',kind:'table',headers:['x','y'],rows:[[0,0],[6,15],[8,20],[19,47.5]],correct:true,k:2.5,kUnit:'units of y per 1 x',hint:'Divide 15 by 6 and 20 by 8. Do you get the same number?',explanation:'15 ÷ 6 = 2.5, 20 ÷ 8 = 2.5, and 47.5 ÷ 19 = 2.5. The origin is included. k = 2.5.'},
  {id:'T-D',stage:0,letter:'D',prompt:'Is this time-and-cost table proportional?',kind:'table',headers:['Time (hours)','Cost (dollars)'],rows:[[0,'$100'],[1,'$150'],[2,'$200'],[3,'$250']],correct:false,why:['At 0 hours, the cost is already $100.','The price rises by $50 per hour.','There are four ordered pairs.'],proofIndex:0,hint:'Focus on the row where the number of hours is zero.',explanation:'At 0 hours, the cost is $100. The rule is y = 50x + 100, so it is NOT y = kx.'},
  {id:'G-A',stage:1,letter:'A',prompt:'Does Graph A show a proportional relationship?',kind:'graph',graph:'A',correct:false,why:['It rises as x increases at first.','It crosses the origin.','It curves instead of following one straight line.'],proofIndex:2,hint:'Passing through (0, 0) is not enough. The graph also has to be straight.',explanation:'The graph curves and changes direction. There is no single constant multiplier k for all points.'},
  {id:'G-B',stage:1,letter:'B',prompt:'Does Graph B show a proportional relationship?',kind:'graph',graph:'B',correct:false,why:['The line does not go through the origin.','The line slopes upward.','The graph is straight.'],proofIndex:0,hint:'Notice where the line crosses the y-axis. Is it at (0, 0)?',explanation:'It is a straight line, but it crosses the y-axis above zero. It has a starting amount, so it is not proportional.'},
  {id:'G-C',stage:1,letter:'C',prompt:'Does Graph C show a proportional relationship?',kind:'graph',graph:'C',correct:true,k:2,kUnit:'units of y per 1 x',hint:'The line includes (0, 0). Use a visible point such as (2, 4) to calculate y ÷ x.',explanation:'This straight line goes through (0, 0). At (2, 4), k = 4 ÷ 2 = 2, so y = 2x.'},
  {id:'G-D',stage:1,letter:'D',prompt:'Does Graph D show a proportional relationship?',kind:'graph',graph:'D',correct:false,why:['It makes a curved arch instead of a straight line.','It goes down on the right side.','It touches the x-axis in two places.'],proofIndex:0,hint:'A proportional graph never bends. Does this shape stay straight?',explanation:'The graph is a curve, not a single straight line through the origin. The rate is not constant.'},
  {id:'E-1',stage:2,letter:'1',prompt:'Is this equation proportional?',kind:'equation',equation:'y = 3x',correct:true,k:3,kUnit:'units of y per 1 x',hint:'In the pattern y = kx, k is the coefficient attached to x.',explanation:'It already has the exact form y = kx. The multiplier is 3, so k = 3.'},
  {id:'E-2',stage:2,letter:'2',prompt:'Is this equation proportional?',kind:'equation',equation:'y = 5x + 2',correct:false,why:['The number 5 multiplies x.','There is an extra +2, so y = 2 when x = 0.','The equation contains an x.'],proofIndex:1,hint:'Substitute x = 0. Does this produce y = 0?',explanation:'The +2 is a starting amount. When x = 0, y = 2. This cannot be written as y = kx alone.'},
  {id:'S-3',stage:2,letter:'3',prompt:'Is the moving-truck situation proportional?',kind:'story',story:'To rent a moving truck, you must pay a <strong>$100 rental fee</strong>. You must also pay <strong>$20 per mile</strong>.',correct:false,why:['It charges $20 for every mile.','The truck is rented for a trip.','There is a $100 fee even if you drive 0 miles.'],proofIndex:2,hint:'How much would you owe for 0 miles? Think about the starting amount.',explanation:'The cost is y = 20x + 100, with x in miles. The $100 starting fee breaks proportionality.'},
  {id:'S-4',stage:2,letter:'4',prompt:'Is the family-road-trip situation proportional?',kind:'story',story:'On a family road trip, your parents drove a <strong>steady 260 miles in 4 hours</strong>.',correct:true,k:65,kUnit:'miles per hour',kQuestion:'Let x = hours and y = miles. What is k in miles per hour?',hint:'A steady rate means equal miles per hour. Divide total miles by total hours.',explanation:'At a steady pace, 260 ÷ 4 = 65 miles per hour. Distance = 65 × time, so k = 65 miles per hour.'},
  {id:'E-5',stage:2,letter:'5',prompt:'Is this equation proportional?',kind:'equation',equation:'y = 25x + 5',correct:false,why:['The +5 means y is not 0 when x is 0.','The coefficient of x is 25.','The equation contains two numbers.'],proofIndex:0,hint:'Which part of the equation is present even if x is zero?',explanation:'The +5 is an initial amount. This rule is not of the form y = kx.'},
  {id:'E-6',stage:2,letter:'6',prompt:'Is this equation proportional?',kind:'equation',equation:'y = 0.75x',correct:true,k:0.75,kUnit:'units of y per 1 x',hint:'The coefficient multiplying x is the constant of proportionality.',explanation:'There is no added amount. The relationship is y = kx with k = 0.75 (or 3/4).'},
  {id:'S-7',stage:2,letter:'7',prompt:'Is the treadmill situation proportional?',kind:'story',story:'Your friend ran <strong>5 miles</strong> on the treadmill at a <strong>constant rate</strong> for <strong>45 minutes</strong>.',correct:true,k:9,kUnit:'minutes per mile',kQuestion:'Let x = miles and y = minutes. What is k in minutes per mile?',hint:'Because x = miles and y = minutes, divide 45 minutes by 5 miles.',explanation:'45 ÷ 5 = 9 minutes per mile. With distance in miles and time in minutes, y = 9x, so k = 9.'},
  {id:'S-8',stage:2,letter:'8',prompt:'Is the carnival situation proportional?',kind:'story',story:'To enter the carnival, you must pay <strong>$3</strong>. Once you are inside, you pay <strong>$2 for every game</strong> you play.',correct:false,why:['The games cost $2 each.','There is a $3 cost even if you play 0 games.','The total amount depends on games played.'],proofIndex:1,hint:'How much would you pay if you entered but played no games?',explanation:'The entry fee is an extra $3. Total cost = 2 × games + 3, not y = kx.'}
];
let state={name:'',period:'',startedAt:'',index:0,done:{},wrong:{},hints:{},exitPassed:false,completedAt:''};
let temp={decision:'',reason:'',k:'',notice:null,showHint:false};
const $=id=>document.getElementById(id);
function esc(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function store(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(err){}}
function restore(){try{const obj=JSON.parse(localStorage.getItem(KEY));if(obj&&typeof obj.name==='string'&&obj.name.trim()&&typeof obj.done==='object')return obj;}catch(err){}return null;}
function countDone(){return ITEMS.filter(q=>state.done&&state.done[q.id]).length;}
function updateHeader(){const n=countDone();$('progressLabel').textContent=n+' of 16 examples verified';$('progressFill').style.width=(100*n/16)+'%';$('progressOuter').setAttribute('aria-valuenow',n);$('whoLine').textContent=state.name?`${state.name} · ${state.period} · INTRO ACTIVITY`:'BEFORE YOU START PROPORTION QUEST';}
function stageFor(index){return STAGES.findIndex(s=>index>=s.start&&index<s.end);}
function sidebar(){return `<aside class="side" aria-label="Activity stages"><div class="smalltitle">Your lab route</div>${STAGES.map((s,i)=>{const completed=ITEMS.slice(s.start,s.end).filter(q=>state.done[q.id]).length;const active=stageFor(state.index)===i;return `<div class="stage ${completed===s.end-s.start?'complete':''} ${active?'active':''}"><span class="bubble" aria-hidden="true">${completed===s.end-s.start?'✓':i+1}</span><span>${esc(s.title)}<small>${completed}/${s.end-s.start} verified</small></span></div>`;}).join('')}<div class="sideinfo">A <strong>proportion</strong> keeps the same multiplier: <strong>y = kx</strong>.<br><br>Prove your decision to earn each checkpoint stamp.</div></aside>`;}
function intro(saved){updateHeader();$('app').innerHTML=`<section class="shell hero"><div class="kicker">The warm-up before the quest</div><h1>Can you spot a <span class="highlight">constant multiplier</span>?</h1><p>Proportional relationships have one rule that works every time: <strong>y = kx</strong>. The number <strong>k</strong> is the <strong>constant of proportionality</strong>—the same multiplier connecting the two quantities.</p><div class="mini-grid"><div class="mini"><strong>▦ Tables</strong><span>For nonzero x, y ÷ x stays the same. Zero goes with zero.</span></div><div class="mini"><strong>⌁ Graphs</strong><span>One straight line must go through (0, 0).</span></div><div class="mini"><strong>≋ Equations</strong><span>The rule looks like y = kx, with no extra + or − amount.</span></div><div class="mini"><strong>◷ Stories</strong><span>A constant per-one rate with no starting fee.</span></div></div><p><strong>Your mission:</strong> Verify the 16 examples from your worksheets. Every answer needs a decision <em>and</em> evidence. A hint can help you think, but it won't hand you an answer.</p>${saved?`<div class="resume"><strong>Saved checkpoint found</strong><p>${esc(saved.name)} · ${esc(saved.period)} · ${Object.keys(saved.done||{}).length} examples completed</p><div class="actions"><button type="button" class="btn primary" id="resumeBtn">Resume this student's work</button><button type="button" class="btn secondary" id="newBtn">Start a new student</button></div></div>`:''}<form id="startForm"><div class="startbar"><div class="field"><label for="studentName">Student first and last name</label><input id="studentName" type="text" maxlength="60" autocomplete="name" placeholder="Enter your name" required /></div><div class="field"><label for="classPeriod">Class period</label><select id="classPeriod" required><option value="">Choose your period</option><option>Green</option><option>Purple</option><option>Orange</option><option>Blue</option><option>Other</option></select></div></div><div class="actions"><button class="btn primary" type="submit">Start the checkpoint →</button><span class="tip">This is the INTRO, not Proportion Quest.</span></div></form><div class="session-note"><strong>Before opening Proportion Quest:</strong> Finish the checkpoint and show or submit your completion screen as your teacher directs. Progress is saved only in this browser, not sent to your teacher.</div></section>`;
$('startForm').addEventListener('submit',e=>{e.preventDefault();const name=$('studentName').value.trim().replace(/\s+/g,' ');const period=$('classPeriod').value;if(!name||!period)return;state={name,period,startedAt:new Date().toISOString(),index:0,done:{},wrong:{},hints:{},exitPassed:false,completedAt:''};store();temp={decision:'',reason:'',k:'',notice:null,showHint:false};render();});
if(saved){$('resumeBtn').addEventListener('click',()=>{state=saved;temp={decision:'',reason:'',k:'',notice:null,showHint:false};render();});$('newBtn').addEventListener('click',()=>{$('studentName').focus();$('startForm').scrollIntoView({behavior:'smooth',block:'center'});});}
}
function graphSvg(letter){let N=18,S=16,left=35,top=20,W=N*S,ox=left+8*S,oy=top+10*S;const X=x=>ox+x*S,Y=y=>oy-y*S;
 const grid=[];for(let j=0;j<=18;j++){let x=left+j*S,y=top+j*S;grid.push(`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+W}" stroke="${j%2?'#e4eeeb':'#d1e1de'}" stroke-width="${j%2?.65:.95}"/>`);grid.push(`<line x1="${left}" y1="${y}" x2="${left+W}" y2="${y}" stroke="${j%2?'#e4eeeb':'#d1e1de'}" stroke-width="${j%2?.65:.95}"/>`)}
 let path='',desc='';
 if(letter==='A'){path=`M ${X(0)} ${Y(0)} C ${X(2)} ${Y(4.0)}, ${X(3.6)} ${Y(9.2)}, ${X(4.4)} ${Y(7.2)} C ${X(5.1)} ${Y(4.7)}, ${X(4.8)} ${Y(0.5)}, ${X(5.7)} ${Y(0.5)} C ${X(6.5)} ${Y(0.3)}, ${X(8)} ${Y(3.6)}, ${X(9.1)} ${Y(5.6)}`;desc='A curve starts at the origin, climbs, dips, and then rises again.';}
 if(letter==='B'){path=`M ${X(-.5)} ${Y(2.5)} L ${X(7)} ${Y(10)}`;desc='A straight rising line crosses the y-axis at 3, not 0.';}
 if(letter==='C'){path=`M ${X(0)} ${Y(0)} L ${X(5)} ${Y(10)}`;desc='A straight rising line includes points (0,0), (2,4), and (4,8).';}
 if(letter==='D'){path=`M ${X(-6)} ${Y(-1.3)} C ${X(-4.2)} ${Y(3.7)}, ${X(-2)} ${Y(7)}, ${X(0)} ${Y(7)} C ${X(2)} ${Y(7)}, ${X(4.2)} ${Y(3.7)}, ${X(6)} ${Y(-1.3)}`;desc='A downward-opening curve with its highest point on the positive y-axis.';}
 const labels=[];for(let t=-8;t<=10;t+=2){if(t!==0){labels.push(`<text x="${X(t)}" y="${oy+13}" text-anchor="middle" font-size="8" fill="#697e80">${t}</text>`);labels.push(`<text x="${ox-7}" y="${Y(t)+3}" text-anchor="end" font-size="8" fill="#697e80">${t}</text>`);}}
 return `<svg class="graphsvg" viewBox="0 0 360 340" role="img" aria-label="Coordinate graph ${letter}. ${desc}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="lineArrow${letter}" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#116c80"/></marker></defs><rect x="${left}" y="${top}" width="${W}" height="${W}" fill="white" stroke="#b2c5c1"/>${grid.join('')}<line x1="${left-8}" y1="${oy}" x2="${left+W+9}" y2="${oy}" stroke="#234d56" stroke-width="1.6"/><line x1="${ox}" y1="${top+W+8}" x2="${ox}" y2="${top-10}" stroke="#234d56" stroke-width="1.6"/><path d="M${left+W+9} ${oy} l-6 -3 v6 z" fill="#234d56"/><path d="M${ox} ${top-10} l-3 6 h6 z" fill="#234d56"/>${labels.join('')}<text x="${ox-7}" y="${oy+13}" font-size="9" text-anchor="end" fill="#234d56">0</text><text x="${left+W+13}" y="${oy-6}" font-size="13" font-weight="800" fill="#234d56">x</text><text x="${ox+6}" y="${top-9}" font-size="13" font-weight="800" fill="#234d56">y</text><path d="${path}" fill="none" stroke="#116c80" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lineArrow${letter})"/></svg>`;
}
function viewItem(q){if(q.kind==='table')return `<div class="artifact"><table class="math-table"><thead><tr>${q.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${q.rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 if(q.kind==='graph')return `<div class="artifact">${graphSvg(q.graph)}<div class="graphlabel">Graph ${q.letter} · One square = 1 unit</div></div>`;
 if(q.kind==='equation')return `<div class="artifact"><div class="equation">${esc(q.equation)}</div></div>`;
 return `<div class="artifact"><p class="scenario">${q.story}</p></div>`;
}
function evidenceHtml(q){if(!temp.decision)return '';
 if(temp.decision==='yes'){return `<div class="evidence" id="evidence"><div class="whytitle">🔎 Prove it: Find the constant of proportionality.</div><p class="micro" style="margin:0 0 9px">${esc(q.kQuestion||'Use k = y ÷ x. What is the multiplier k?')}</p><div class="krow"><label for="answerK">k =</label><input class="kinput" id="answerK" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5 or 3/4" value="${esc(temp.k)}" aria-label="Enter constant of proportionality" /></div><p class="micro">Enter a number or simple fraction. ${q.kUnit?'Units: '+esc(q.kUnit)+'.':''}</p></div>`;}
 return `<div class="evidence" id="evidence"><div class="whytitle">🔎 Prove it: Which clue best supports your decision?</div><div class="radios">${(q.why||['A starting amount prevents y = kx.','The y ÷ x value changes.','The graph misses the origin or bends.']).map((s,i)=>`<label class="answerline"><input type="radio" name="why" value="${i}" ${String(i)===temp.reason?'checked':''} /><span>${esc(s)}</span></label>`).join('')}</div></div>`;
}
function stageRecap(index){if(index===4)return 'Table takeaway: an equal ADDITIVE increase does not guarantee an equal MULTIPLIER. Check both k and (0, 0).';if(index===8)return 'Graph takeaway: a line through the origin is proportional; a curve or a line missing the origin is not.';return '';}
function render(){updateHeader();if(state.exitPassed){renderFinish();return;}if(state.index>=ITEMS.length){renderExit();return;}const q=ITEMS[state.index],s=STAGES[q.stage],complete=!!state.done[q.id];const label=`Example ${state.index+1} of ${ITEMS.length}`;$('app').innerHTML=`<div class="route">${sidebar()}<div class="workspace"><div class="missionhead"><div><div class="kicker">Stage ${q.stage+1} of 3 · ${esc(s.title)}</div><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p></div><span class="count">${label}</span></div>${[4,8].includes(state.index)&&!complete?`<div class="session-note" style="margin:0 0 15px">${esc(stageRecap(state.index))}</div>`:''}<section class="item" aria-label="${esc(label)}"><h2 class="itemtitle"><span class="taskid">${esc(q.letter)}.</span> ${esc(q.prompt)}</h2><div class="questionbody"><div>${viewItem(q)}</div><div><div class="labeltop">Step 1 · Make your decision</div>${complete?`<div class="feedback good"><strong>✓ Verified!</strong>Your answer and evidence both checked out.</div><div class="correctproof"><h3>Why it works</h3><p>${esc(q.explanation)}</p></div>`:`<div class="choose" role="radiogroup" aria-label="Is the relationship proportional?"><label class="choice ${temp.decision==='yes'?'selected':''}"><input type="radio" name="decision" value="yes" ${temp.decision==='yes'?'checked':''}/><span>Yes, proportional</span></label><label class="choice ${temp.decision==='no'?'selected':''}"><input type="radio" name="decision" value="no" ${temp.decision==='no'?'checked':''}/><span>No, not proportional</span></label></div>${evidenceHtml(q)}${temp.notice?`<div class="feedback ${temp.notice.type}" id="feedback" role="status"><strong>${esc(temp.notice.title)}</strong>${esc(temp.notice.text)}</div>`:''}${temp.showHint?`<div class="hintbox" id="hintBox"><strong>Thinking hint:</strong> ${esc(q.hint)}</div>`:''}`}</div></div><div class="navline"><div class="actions" style="margin:0">${!complete?`<button class="btn primary" id="checkBtn" type="button">Check my proof</button><button class="hintbtn" type="button" id="hintBtn">${temp.showHint?'Hide thinking hint':'Need a thinking hint?'}</button>`:`<button class="btn primary" id="nextBtn" type="button">${state.index===ITEMS.length-1?'Final checkpoint →':'Next example →'}</button>`}</div><button type="button" class="btn subtle" id="backBtn" ${state.index===0?'disabled':''}>← Previous</button></div></section><div class="note" style="margin:13px 4px">✓ All examples must be verified before you can finish. Hints guide your reasoning, not the answer.</div></div></div>`;
 if(!complete){document.querySelectorAll('input[name="decision"]').forEach(e=>e.addEventListener('change',()=>{temp.decision=e.value;temp.k='';temp.reason='';temp.notice=null;render();}));document.querySelectorAll('input[name="why"]').forEach(e=>e.addEventListener('change',()=>{temp.reason=e.value;temp.notice=null;}));const k=$('answerK');if(k)k.addEventListener('input',()=>{temp.k=k.value;temp.notice=null;});$('checkBtn').addEventListener('click',()=>check(q));$('hintBtn').addEventListener('click',()=>{temp.showHint=!temp.showHint;if(temp.showHint){state.hints[q.id]=(state.hints[q.id]||0)+1;store();}render();});}else $('nextBtn').addEventListener('click',()=>{state.index=Math.min(ITEMS.length,state.index+1);temp={decision:'',reason:'',k:'',notice:null,showHint:false};store();render();window.scrollTo({top:0,behavior:'smooth'});});$('backBtn').addEventListener('click',()=>{if(state.index>0){state.index--;temp={decision:'',reason:'',k:'',notice:null,showHint:false};store();render();window.scrollTo({top:0,behavior:'smooth'});}});
}
function parseK(value){const v=String(value).trim().replace('−','-');if(!v)return NaN;if(/^[-+]?\d+(?:\.\d+)?\s*\/\s*[-+]?\d+(?:\.\d+)?$/.test(v)){const[a,b]=v.split('/').map(Number);return b===0?NaN:a/b;}if(/^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(v))return Number(v);return NaN;}
function check(q){if(!temp.decision){temp.notice={type:'info',title:'Start with your decision.',text:'Choose proportional or not proportional, then support it.'};render();return;}
 const picked=temp.decision==='yes';const badClassification=picked!==q.correct;if(badClassification){wrong(q,`Look for the same MULTIPLICATIVE relationship in every part of this ${q.kind==='story'?'situation':q.kind}. Reconsider your decision.`);return;}
 if(picked){const input=$('answerK');if(input)temp.k=input.value;const num=parseK(temp.k);if(!Number.isFinite(num)){temp.notice={type:'info',title:'Add your proof.',text:'Enter the constant of proportionality k as a number or fraction.'};render();return;}if(Math.abs(num-q.k)>1e-5){wrong(q,'Your decision might be right, but k needs another look. Always divide y by x in the units shown.');return;}}
 else{const selected=document.querySelector('input[name="why"]:checked');if(selected)temp.reason=selected.value;if(temp.reason===''){temp.notice={type:'info',title:'Add your proof.',text:'Choose the clue that best supports your decision.'};render();return;}if(Number(temp.reason)!==q.proofIndex){wrong(q,'Your decision might be right, but your clue is not the strongest mathematical evidence. Think about y = kx.');return;}}
 state.done[q.id]={attempts:(state.wrong[q.id]||0)+1,usedHint:!!state.hints[q.id]};temp.notice=null;store();render();
}
function wrong(q,message){state.wrong[q.id]=(state.wrong[q.id]||0)+1;store();const attempt=state.wrong[q.id];temp.notice={type:'error',title:'Not verified yet — try again.',text:message+(attempt>=2?' Consider opening the thinking hint if you are stuck.':'')};render();}
function renderExit(){updateHeader();$('app').innerHTML=`<section class="shell finish"><div class="kicker">Final knowledge check</div><h1 style="margin:9px 0 8px">You checked all 16 examples! 🎉</h1><p>You’ve found patterns in tables, graphs, equations, and situations. One last question connects all four.</p><div class="reflection"><h2 style="font-size:1.2rem;margin:0 0 12px">What do ALL proportional relationships have in common?</h2><div class="radios">${['The amount added to y stays the same.','A single constant multiplier k connects x and y: y = kx.','The graph always rises from left to right.'].map((x,i)=>`<label class="answerline"><input type="radio" name="exit" value="${i}"/><span>${esc(x)}</span></label>`).join('')}</div><div id="exitFeedback" aria-live="polite"></div></div><div class="actions"><button class="btn primary" id="exitBtn" type="button">Verify my final answer</button><button class="btn secondary" id="lastBtn" type="button">Review previous example</button></div></section>`;$('exitBtn').addEventListener('click',()=>{const v=document.querySelector('input[name="exit"]:checked');if(!v){$('exitFeedback').innerHTML='<div class="feedback info">Choose the statement you can defend.</div>';return;}if(v.value!=='1'){$('exitFeedback').innerHTML='<div class="feedback error"><strong>Try again.</strong>Think about what the letter k represents, not just whether numbers go up.</div>';return;}state.exitPassed=true;state.completedAt=new Date().toISOString();store();render();});$('lastBtn').addEventListener('click',()=>{state.index=15;store();render();});}
function formatDate(iso){try{return new Intl.DateTimeFormat('en-US',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso));}catch(e){return iso||'';}}
function summary(){const first=ITEMS.filter(q=>(state.wrong[q.id]||0)===0).length;const used=ITEMS.filter(q=>(state.hints[q.id]||0)>0).length;const counts=STAGES.map(s=>ITEMS.slice(s.start,s.end).length);return `PROPORTION CHECKPOINT — INTRO COMPLETION\nStudent: ${state.name}\nPeriod: ${state.period}\nCompleted: ${formatDate(state.completedAt)}\nVerified: 16 of 16 examples + final knowledge check\nSections: Tables ${counts[0]}/${counts[0]}, Graphs ${counts[1]}/${counts[1]}, Equations/Stories ${counts[2]}/${counts[2]}\nVerified on first check: ${first} of 16\nExamples where a thinking hint was opened: ${used}\nNext: Proportion Quest`}
function renderFinish(){updateHeader();const first=ITEMS.filter(q=>(state.wrong[q.id]||0)===0).length;const hints=ITEMS.filter(q=>(state.hints[q.id]||0)>0).length;$('app').innerHTML=`<section class="shell finish"><div class="kicker">Checkpoint complete · All proofs verified</div><div class="finishicon" aria-hidden="true">🏁</div><h1 style="margin:7px 0 6px;font-size:clamp(1.9rem,4vw,2.75rem)">Ready for Proportion Quest!</h1><p>You showed how to recognize <strong>k, the constant of proportionality</strong>, across tables, graphs, equations, and stories.</p><div class="certificate" id="completionCertificate"><div class="kicker">Completion certificate · Intro activity</div><h2>Proportion Checkpoint</h2><div class="certname">${esc(state.name)}</div><div>${esc(state.period)} class · ${esc(formatDate(state.completedAt))}</div><div class="certrow"><span class="certpill">✓ 16 / 16 verified</span><span class="certpill">✓ Final knowledge check</span><span class="certpill">✓ 3 stages cleared</span></div><p style="margin-bottom:4px">First-check proofs: ${first} of 16 · Examples with hints used: ${hints}</p><p class="tip" style="margin:6px 0 0">This certificate shows that every answer was eventually verified. It is saved in this browser, not automatically sent to your teacher.</p></div><h3 style="margin-bottom:5px">Your next step</h3><p><strong>Show this completion screen to your substitute or submit a screenshot in Canvas as directed.</strong> Then open <strong>Proportion Quest</strong> separately. The coral-and-teal page is your INTRO.</p><div class="actions"><button class="btn primary" id="copyBtn" type="button">Copy completion summary</button><button class="btn secondary" id="printBtn" type="button">Print / save as PDF</button><button class="btn subtle" id="reviewBtn" type="button">Review explanations</button></div><div id="reviewList" hidden style="margin-top:12px;padding:16px;border:1px solid #bcdcd3;border-radius:12px;background:#f7fcf8"><h3 style="margin-top:0">Verified explanations</h3>${ITEMS.map(q=>`<p style="margin:7px 0 12px;font-size:.9rem"><strong>${esc(q.id)}:</strong> ${esc(q.explanation)}</p>`).join('')}</div><p id="copyStatus" class="tip" aria-live="polite"></p><div class="session-note">Teacher note: This is a static GitHub Pages activity. It checks answers on this device but cannot transmit student scores or prove identity. Collect a screenshot or copied summary through Canvas if you need a record.</div></section>`;$('copyBtn').addEventListener('click',async()=>{const value=summary();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);}else{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy');}$('copyStatus').textContent='Copied! Paste this into Canvas or wherever your teacher directs.';}catch(e){$('copyStatus').textContent='Copy was unavailable. Take a screenshot of this screen instead.';}});$('printBtn').addEventListener('click',()=>window.print());$('reviewBtn').addEventListener('click',()=>{const list=$('reviewList');list.hidden=!list.hidden;$('reviewBtn').textContent=list.hidden?'Review explanations':'Hide explanations';});}
const recovered=restore();if(recovered)intro(recovered);else intro(null);
</script>
